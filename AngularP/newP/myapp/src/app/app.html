<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #333;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        .navbar a {
            color: white;
            padding: 10px 15px;
            text-decoration: none;
        }
        .navbar a:hover:not(.disabled) {
            background-color: #575757;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            color: black;
            padding: 10px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .disabled {
            color: gray;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#">HOC Gadget shop</a>
        
        <div class="dropdown">
            <a class="disabled" href="#">Admin (Disabled)</a>
            <div class="dropdown-content">
                <a routerLink="/inventory">Inventory</a>
                <a href="#">Customers</a>
                <a href="#">Something else here</a>
            </div>
        </div>
    </nav>
</body>
</html>
